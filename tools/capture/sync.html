<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>capture sync test</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="tank"></canvas>
<script type="module">
// Calibrates the capture pipeline: every animation frame paints its own number as 12 black/white
// bars and records the clock time it was painted at. Decoding the recording gives, for each video
// frame, the clock time its content was drawn, to compare with what the recorder logged.
// `?gpu` paints with WebGPU (as Tidal does), otherwise with a 2D context.
import '/src/capture/recorder.ts';
const c = document.querySelector('#tank');
const BITS = 12;
window.__painted = [];
let n = 0;
let paint;
if (new URLSearchParams(location.search).has('gpu')) {
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const format = navigator.gpu.getPreferredCanvasFormat();
  const ctx = c.getContext('webgpu');
  ctx.configure({ device, format, alphaMode: 'opaque' });
  const bars = device.createTexture({ size: [BITS, 1], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
  const module = device.createShaderModule({ code: `
    @group(0) @binding(0) var bars: texture_2d<f32>;
    @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
      let p = array(vec2f(-1, -1), vec2f(3, -1), vec2f(-1, 3));
      return vec4f(p[i], 0, 1);
    }
    @group(0) @binding(1) var<uniform> width: vec4f;
    @fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {
      return textureLoad(bars, vec2i(i32(p.x / width.x * ${BITS}.0), 0), 0);
    }` });
  const pipeline = device.createRenderPipeline({ layout: 'auto', vertex: { module, entryPoint: 'vs' }, fragment: { module, entryPoint: 'fs', targets: [{ format }] } });
  const uniform = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: bars.createView() }, { binding: 1, resource: { buffer: uniform } }] });
  const px = new Uint8Array(BITS * 4);
  paint = () => {
    for (let i = 0; i < BITS; i++) px.fill((n >> (BITS - 1 - i)) & 1 ? 255 : 0, i * 4, i * 4 + 4);
    device.queue.writeTexture({ texture: bars }, px, { bytesPerRow: BITS * 4 }, [BITS, 1]);
    device.queue.writeBuffer(uniform, 0, new Float32Array([c.width, 0, 0, 0]));
    const enc = device.createCommandEncoder();
    const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3); pass.end();
    device.queue.submit([enc.finish()]);
  };
} else {
  const x = c.getContext('2d');
  paint = () => {
    const bw = c.width / BITS;
    for (let i = 0; i < BITS; i++) {
      x.fillStyle = (n >> (BITS - 1 - i)) & 1 ? '#fff' : '#000';
      x.fillRect(i * bw, 0, bw, c.height);
    }
  };
}
function draw(now) {
  if (c.width !== innerWidth || c.height !== innerHeight) { c.width = innerWidth; c.height = innerHeight; }
  paint();
  window.__painted.push([n, performance.timeOrigin + now]);
  n = (n + 1) % (1 << BITS);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
